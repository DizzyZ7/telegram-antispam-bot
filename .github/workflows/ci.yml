name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: node --check writers_submission/static/app.js
      - run: node --test tests/test_writers_mobile_photo_client.cjs
      - run: node --test tests/test_writers_draft_client.cjs
      - run: node --test tests/test_writers_upload_progress_client.cjs
      - run: node --test tests/test_writers_deferred_upload_client.cjs
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -p "test_*.py"

  entertainment-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: entertainment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d entertainment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/entertainment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_entertainment_storage_postgres tests.test_entertainment_storage_factory tests.test_entertainment_memory_postgres tests.test_entertainment_culture_memory_postgres tests.test_entertainment_culture_windows_postgres tests.test_entertainment_message_purge tests.test_zero_trust_postgres tests.test_writers_submission_postgres -v

  bothost-python-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python Docker image
        run: docker build --file Dockerfile --tag telegram-antispam-bot:ci .
